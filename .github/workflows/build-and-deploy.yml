name: Deploy React to S3 & CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies & Build React app (Inject Env Variables)
        run: |
          npm ci
          npx cross-env REACT_APP_FILE_BASEURL=${{ secrets.REACT_APP_FILE_BASEURL }} REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} CI=false npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload React build files to S3
        run: |
          aws s3 sync build/ s3://${{ secrets.AWS_REACT_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

